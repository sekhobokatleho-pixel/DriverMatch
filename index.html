<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriverMatch</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#0b7a4b;--bd:#e3e6eb;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101317;--card:#1a1f26;--tx:#eef1f5;--mut:#9aa4b2;--ac:#2fbf80;--bd:#2a313b;--er:#ff7a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101317;--card:#1a1f26;--tx:#eef1f5;--mut:#9aa4b2;--ac:#2fbf80;--bd:#2a313b;--er:#ff7a6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{margin:6px 0 12px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px;margin:2px 0 8px}
input,select{width:100%;box-sizing:border-box;padding:10px;margin:0 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.row,.tabs{display:flex;gap:6px;margin:0 0 10px}.tabs{overflow-x:auto}.row button{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
a{color:var(--ac)}#msg{min-height:20px;margin:0 0 6px;font-weight:600}
</style></head><body><main>
<div id="msg"></div><div id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://wpqmqduwbqlrmhhtqsnw.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwcW1xZHV3YnFscm1oaHRxc253Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTMxMzksImV4cCI6MjEwNzk4OTEzOX0.eTHiQJyEJzE_gC4ZRTFnF3sV1Sknm1CqWy7_SfI8pFc');
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let user=null,role=null,mode='driver',tab='';
const note=(t,bad)=>{$('msg').textContent=t;$('msg').style.color=bad?'var(--er)':'var(--ac)'};

function authView(signup){
 app.innerHTML=`<h1>DriverMatch</h1>
 <div class="row"><button class="${mode=='driver'?'on':''}" onclick="mode='driver';authView(${signup})">I’m a driver</button><button class="${mode=='owner'?'on':''}" onclick="mode='owner';authView(${signup})">I’m an owner</button></div>
 <div class="card"><h2>${signup?'Create '+mode+' account':'Log in as '+mode}</h2>
 ${signup?'<input id="fn" placeholder="Full name"><input id="ph" placeholder="Phone" inputmode="tel">':''}
 ${signup&&mode=='driver'?'<select id="lt"><option>Code 8</option><option>Code 10</option><option>Code 14</option><option>Bike (A1/A)</option></select>':''}
 <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6)">
 <button class="pri" onclick="${signup?'signUp()':'logIn()'}">${signup?'Sign up':'Log in'}</button>
 <p><a href="#" onclick="authView(${!signup});return false">${signup?'Have an account? Log in':'New here? Sign up'}</a></p></div>`;
}
async function ensure(u){const m=u.user_metadata||{};
 let{data:p}=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();
 if(!p&&m.role){await sb.from('profiles').insert({id:u.id,role:m.role,email:u.email,full_name:m.full_name,phone:m.phone});
  if(m.role=='driver')await sb.from('driver_profiles').insert({user_id:u.id,licence_type:m.licence_type});p={role:m.role}}
 return p&&p.role}
async function signUp(){const m={role:mode,full_name:$('fn').value,phone:$('ph').value};
 if(mode=='driver')m.licence_type=$('lt').value;
 const{data,error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value,options:{data:m}});
 if(error)return note(error.message,1);
 if(data.session)return start(data.user);note('Check your email to confirm, then log in.')}
async function logIn(){const{data,error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
 if(error)return note(error.message,1);start(data.user)}
async function start(u){user=u;role=await ensure(u);
 if(!role||role!=mode){await sb.auth.signOut();user=null;return note(role?`This is a ${role} account. Use the ${role} login.`:'Could not load your profile.',1)}
 note('');tab=role=='driver'?'vehicle_cards':'driver_cards';home()}
async function out(){await sb.auth.signOut();user=null;note('');authView(false)}

const TABS=()=>role=='driver'?[['vehicle_cards','Vehicles'],['profile','My offer'],['requests','Requests'],['documents','Docs'],['notifications','Alerts']]
 :[['driver_cards','Drivers'],['vehicles','My vehicles'],['requests','Requests'],['documents','Documents'],['notifications','Alerts']];
async function home(){
 app.innerHTML=`<div class="top"><b>DriverMatch · ${role}</b><button onclick="out()">Log out</button></div>
 <div class="tabs">${TABS().map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';home()">${l}</button>`).join('')}</div><div id="body">Loading…</div>`;
 const e=await V[tab]();if(e)note(e.message,1)}
const empty=t=>`<p class="mut">${t}</p>`;
const V={
 async vehicle_cards(){const{data,error}=await sb.from('vehicle_cards').select('*');if(error)return error;
  $('body').innerHTML=data.length?data.map(v=>`<div class="card"><b>${esc(v.make)} ${esc(v.model)}</b> ${esc(v.year)}<div class="mut">${esc(v.vehicle_type)} · ${esc(v.kms)} km · ${esc(v.vehicle_code)}</div><button class="pri" onclick="ask('${v.id}')">Request match</button></div>`).join(''):empty('No vehicles listed yet.')},
 async driver_cards(){const[a,b]=await Promise.all([sb.from('driver_cards').select('*'),sb.from('vehicles').select('id,make,model,vehicle_code').eq('owner_id',user.id)]);
  if(a.error)return a.error;const opts=(b.data||[]).map(v=>`<option value="${v.id}">${esc(v.make)} ${esc(v.model)} (${esc(v.vehicle_code)})</option>`).join('');
  $('body').innerHTML=a.data.length?a.data.map(d=>`<div class="card"><b>${esc(d.driver_code)}</b> · ${esc(d.licence_type)}<div class="mut">Documents verified</div><select id="s${d.id}">${opts}</select><button class="pri" onclick="ask('${d.id}')">Request match</button></div>`).join(''):empty('No verified drivers yet.')},
 async requests(){const{data,error}=await sb.from('requests').select('*').order('created_at',{ascending:false});if(error)return error;
  $('body').innerHTML=data.length?data.map(r=>`<div class="card"><b>Request ${esc(r.id.slice(0,8))}</b><div class="mut">${esc(r.status)} · started by ${esc(r.initiated_by)}</div>${r.status=='pending'&&r.initiated_by!=role?`<button class="pri" onclick="respond('${r.id}','accepted')">Accept</button> <button onclick="respond('${r.id}','declined')">Decline</button>`:''}</div>`).join(''):empty('No requests yet.')},
 async vehicles(){const{data,error}=await sb.from('vehicles').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return error;
  $('body').innerHTML=`<div class="card"><h2>Add a vehicle</h2><select id="vt"><option>car</option><option>bike</option></select><input id="mk" placeholder="Make"><input id="md" placeholder="Model"><input id="yr" type="number" placeholder="Year"><input id="km" type="number" placeholder="Kms"><input id="wk" type="number" placeholder="Weekly amount you accept (R)"><button class="pri" onclick="addVehicle()">Add vehicle</button></div>`
  +data.map(v=>`<div class="card"><b>${esc(v.make)} ${esc(v.model)}</b> ${esc(v.year)}<div class="mut">${esc(v.vehicle_code)} · ${esc(v.kms)} km · R${esc(v.weekly_amount)}/week · ${esc(v.status)}</div></div>`).join('')},
 async documents(){const[a,b]=await Promise.all([sb.from('documents').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),role=='owner'?sb.from('vehicles').select('id,make,model').eq('owner_id',user.id):{data:[]}]);if(a.error)return a.error;
  const T={driver:['id','licence','pdp','police_clearance','selfie_id'],owner:['id','proof_of_ownership','vehicle_photo']}[role];
  $('body').innerHTML=`<div class="card"><h2>Upload a document</h2><select id="dt">${T.map(t=>`<option>${t}</option>`).join('')}</select>${role=='owner'?`<select id="dv"><option value="">No vehicle</option>${(b.data||[]).map(v=>`<option value="${v.id}">${esc(v.make)} ${esc(v.model)}</option>`).join('')}</select>`:''}<input id="fl" type="file" accept="image/*,application/pdf"><button class="pri" onclick="upload()">Upload</button></div>`
  +a.data.map(d=>`<div class="card"><b>${esc(d.doc_type)}</b><div class="mut">${esc(d.status)}${d.admin_note?' · '+esc(d.admin_note):''}</div></div>`).join('')},
 async notifications(){const{data,error}=await sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error)return error;
  $('body').innerHTML=data.length?data.map(n=>`<div class="card"><b>${esc(n.title)}</b><div class="mut">${esc(n.body)}</div></div>`).join(''):empty('No alerts yet.')}
};
async function ask(id){const r=role=='driver'?{driver_id:user.id,vehicle_id:id}:{driver_id:id,vehicle_id:($('s'+id)||{}).value};
 if(!r.vehicle_id)return note('Add a vehicle first.',1);
 const{error}=await sb.from('requests').insert({...r,initiated_by:role});note(error?error.message:'Request sent.',!!error)}
async function respond(id,s){const{error}=await sb.from('requests').update({status:s,responded_at:new Date().toISOString()}).eq('id',id);error?note(error.message,1):home()}
async function addVehicle(){const{error}=await sb.from('vehicles').insert({owner_id:user.id,vehicle_type:$('vt').value,make:$('mk').value,model:$('md').value,year:+$('yr').value||null,kms:+$('km').value||null,weekly_amount:+$('wk').value||0});
 error?note(error.message,1):(note('Vehicle added. It will show once approved.'),home())}
async function upload(){const f=$('fl').files[0];if(!f)return note('Choose a file first.',1);
 const path=`${user.id}/${Date.now()}_${f.name.replace(/[^\w.-]/g,'_')}`;
 const u=await sb.storage.from('documents').upload(path,f);if(u.error)return note(u.error.message,1);
 const{error}=await sb.from('documents').insert({user_id:user.id,vehicle_id:($('dv')||{}).value||null,doc_type:$('dt').value,file_path:path});
 error?note(error.message,1):(note('Uploaded. Waiting for admin approval.'),home())}
document.head.insertAdjacentHTML('beforeend','<style>.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac);color:#fff;margin:0 6px 6px 0}.hint{background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:10px;margin:0 0 10px}</style>');
const CITIES=['Bloemfontein','Johannesburg','Pretoria','Cape Town','Durban','Gqeberha','East London','Polokwane','Mbombela','Kimberley','Welkom','Harrismith','Soweto','Pietermaritzburg','Rustenburg'];
const dl=`<datalist id="cities">${CITIES.map(c=>`<option value="${c}">`).join('')}</datalist>`;
const nz=s=>String(s||'').trim().toLowerCase(),rand=n=>'R'+Math.round(+n||0);
const where=x=>[x.suburb,x.city].filter(Boolean).map(esc).join(', ')||'Area not set';
let selVeh=null;
Object.assign(V,{
 async vehicle_cards(){const[m,l]=await Promise.all([sb.from('driver_profiles').select('weekly_offer,city').eq('user_id',user.id).maybeSingle(),sb.from('vehicle_listings').select('*')]);
  if(l.error)return l.error;const me=m.data||{},offer=+me.weekly_offer||0,c=nz(me.city);
  const list=l.data.map(v=>({...v,area:!!c&&nz(v.city)==c,fit:offer>0&&offer>=+v.weekly_amount})).sort((a,b)=>(b.area-a.area)||(b.fit-a.fit));
  const n=list.filter(v=>v.area&&v.fit).length;
  $('body').innerHTML=(offer&&c?`<div class="hint"><b>${n}</b> vehicle${n==1?'':'s'} in ${esc(me.city)} at or below your offer of ${rand(offer)}/week.</div>`:`<div class="hint">Set your weekly offer and area in <a href="#" onclick="tab='profile';home();return false">My offer</a> to see matches near you.</div>`)
  +(list.length?list.map(v=>`<div class="card">${v.area?'<span class="tag">In your area</span>':''}${v.fit?'<span class="tag">Fits your offer</span>':''}<div><b>${esc(v.make)} ${esc(v.model)}</b> ${esc(v.year)}</div><div class="mut">${esc(v.vehicle_type)} · ${esc(v.kms)} km · ${where(v)}</div><div>Owner asks <b>${rand(v.weekly_amount)}</b>/week</div><button class="pri" onclick="ask('${v.id}')">Request match</button></div>`).join(''):empty('No vehicles listed yet.'))},
 async driver_cards(){const[a,b]=await Promise.all([sb.from('driver_listings').select('*'),sb.from('vehicles').select('id,make,model,weekly_amount,city,suburb').eq('owner_id',user.id)]);
  if(a.error)return a.error;const vs=b.data||[];
  if(!vs.length){$('body').innerHTML=empty('Add a vehicle first in the My vehicles tab. Drivers are matched to its area and weekly amount.');return}
  if(!vs.find(v=>v.id==selVeh))selVeh=vs[0].id;const v=vs.find(x=>x.id==selVeh),c=nz(v.city);
  const list=a.data.map(d=>({...d,area:!!c&&nz(d.city)==c,fit:+d.weekly_offer>=+v.weekly_amount})).sort((x,y)=>(y.area-x.area)||(y.fit-x.fit));
  const n=list.filter(d=>d.area&&d.fit).length;
  $('body').innerHTML=`<select onchange="selVeh=this.value;home()">${vs.map(x=>`<option value="${x.id}" ${x.id==selVeh?'selected':''}>${esc(x.make)} ${esc(x.model)} · ${rand(x.weekly_amount)}/week</option>`).join('')}</select><div class="hint"><b>${n}</b> driver${n==1?'':'s'} in ${esc(v.city||'your area')} willing to pay ${rand(v.weekly_amount)}/week or more.</div>`
  +(list.length?list.map(d=>`<div class="card">${d.area?'<span class="tag">In your area</span>':''}${d.fit?'<span class="tag">Meets your price</span>':''}<div><b>${esc(d.driver_code)}</b> · ${esc(d.licence_type)}</div><div class="mut">${where(d)} · Documents verified</div><div>Offers <b>${d.weekly_offer?rand(d.weekly_offer):'not set'}</b>/week</div><button class="pri" onclick="ask('${d.id}')">Request match</button></div>`).join(''):empty('No verified drivers yet.'))},
 async profile(){const{data,error}=await sb.from('driver_profiles').select('*').eq('user_id',user.id).maybeSingle();if(error)return error;const p=data||{};
  $('body').innerHTML=`${dl}<div class="card"><h2>My weekly offer and area</h2><div class="mut">Owners in your area are told when your offer fits their price, before you pay. Status: ${esc(p.verification_status||'pending')}</div><input id="wo" type="number" placeholder="Weekly amount I’m willing to pay (R)" value="${esc(p.weekly_offer)}"><input id="ci" list="cities" placeholder="Town / city" value="${esc(p.city)}"><input id="su" placeholder="Suburb / township (optional)" value="${esc(p.suburb)}"><button class="pri" onclick="saveProfile()">Save</button></div>`},
 async vehicles(){const{data,error}=await sb.from('vehicles').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return error;
  $('body').innerHTML=`${dl}<div class="card"><h2>Add a vehicle</h2><select id="vt"><option>car</option><option>bike</option></select><input id="mk" placeholder="Make"><input id="md" placeholder="Model"><input id="yr" type="number" placeholder="Year"><input id="km" type="number" placeholder="Kms"><input id="wk" type="number" placeholder="Weekly amount I want to collect (R)"><input id="ci" list="cities" placeholder="Town / city where it is"><input id="su" placeholder="Suburb / township (optional)"><button class="pri" onclick="addVehicle()">Add vehicle</button></div>`
  +data.map(v=>`<div class="card"><b>${esc(v.make)} ${esc(v.model)}</b> ${esc(v.year)}<div class="mut">${esc(v.vehicle_code)} · ${esc(v.kms)} km · ${where(v)} · ${esc(v.status)}</div><div>Collecting <b>${rand(v.weekly_amount)}</b>/week</div><button onclick="editV('${v.id}',${+v.weekly_amount||0})">Change price</button> <button onclick="editArea('${v.id}')">Change area</button></div>`).join('')}
});
async function saveProfile(){const{error}=await sb.from('driver_profiles').update({weekly_offer:+$('wo').value||null,city:$('ci').value.trim(),suburb:$('su').value.trim()}).eq('user_id',user.id);
 error?note(error.message,1):note('Saved.')}
async function addVehicle(){if(!$('ci').value.trim()||!+$('wk').value)return note('Add the weekly amount and the town/city.',1);
 const{error}=await sb.from('vehicles').insert({owner_id:user.id,vehicle_type:$('vt').value,make:$('mk').value,model:$('md').value,year:+$('yr').value||null,kms:+$('km').value||null,weekly_amount:+$('wk').value,city:$('ci').value.trim(),suburb:$('su').value.trim()});
 error?note(error.message,1):(note('Vehicle added. It will show once approved.'),home())}
async function editV(id,cur){const p=prompt('New weekly amount (R)',cur);if(p===null||!+p)return;const{error}=await sb.from('vehicles').update({weekly_amount:+p}).eq('id',id);error?note(error.message,1):home()}
async function editArea(id){const c=prompt('Town / city');if(!c)return;const s=prompt('Suburb / township (optional)')||'';const{error}=await sb.from('vehicles').update({city:c.trim(),suburb:s.trim()}).eq('id',id);error?note(error.message,1):home()}
async function ask(id){const r=role=='driver'?{driver_id:user.id,vehicle_id:id}:{driver_id:id,vehicle_id:selVeh};
 if(!r.vehicle_id)return note('Add a vehicle first.',1);
 const{error}=await sb.from('requests').insert({...r,initiated_by:role});note(error?error.message:'Request sent.',!!error)}
(async()=>{const{data:{session}}=await sb.auth.getSession();
 if(session){const r=await ensure(session.user);if(r){mode=r;return start(session.user)}}authView(false)})();
</script></body></html>
